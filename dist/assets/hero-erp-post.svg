<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc">
  <title id="title">ERP system graphic poster</title>
  <desc id="desc">Brand graphic for ERP development with connected departments and operations metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="61" y1="30" x2="470" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061327"/>
      <stop offset=".65" stop-color="#0a203f"/>
      <stop offset="1" stop-color="#072b3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000817" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="520" height="650" rx="34" fill="url(#bg)"/>
  <circle cx="432" cy="95" r="19" fill="#0bc4b7"/>
  <circle cx="404" cy="532" r="55" fill="#0bc4b7" opacity=".13"/>
  <path d="M58 132h404M58 504h404" stroke="#ffffff" stroke-opacity=".1"/>
  <path d="M78 98h174" stroke="#0bc4b7" stroke-width="9" stroke-linecap="round"/>
  <text x="78" y="157" fill="#fff" font-family="Arial, sans-serif" font-size="55" font-weight="700">ERP</text>
  <text x="81" y="194" fill="#8df9ef" font-family="Arial, sans-serif" font-size="19" letter-spacing="5">OPERATIONS HUB</text>
  <g filter="url(#shadow)">
    <rect x="76" y="243" width="368" height="244" rx="26" fill="#f8fbff"/>
    <circle cx="260" cy="363" r="50" fill="#061327"/>
    <circle cx="260" cy="363" r="20" fill="#0bc4b7"/>
    <g stroke="#0bc4b7" stroke-width="8" stroke-linecap="round">
      <path d="M260 313v-40"/>
      <path d="M260 413v40"/>
      <path d="M210 363h-54"/>
      <path d="M310 363h54"/>
      <path d="M225 328l-38-38"/>
      <path d="M295 398l38 38"/>
    </g>
    <g fill="#eef5f6" stroke="#dce7ea">
      <rect x="116" y="264" width="92" height="46" rx="13"/>
      <rect x="312" y="264" width="92" height="46" rx="13"/>
      <rect x="116" y="416" width="92" height="46" rx="13"/>
      <rect x="312" y="416" width="92" height="46" rx="13"/>
    </g>
    <text x="136" y="293" fill="#061327" font-family="Arial, sans-serif" font-size="15" font-weight="700">Stock</text>
    <text x="333" y="293" fill="#061327" font-family="Arial, sans-serif" font-size="15" font-weight="700">Sales</text>
    <text x="132" y="445" fill="#061327" font-family="Arial, sans-serif" font-size="15" font-weight="700">Teams</text>
    <text x="329" y="445" fill="#061327" font-family="Arial, sans-serif" font-size="15" font-weight="700">Finance</text>
