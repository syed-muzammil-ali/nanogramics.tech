  <text x="78" y="552" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">One system. Live data.</text>
  <text x="78" y="587" fill="#bdebe7" font-family="Arial, sans-serif" font-size="17">Operations, purchasing, inventory, finance.</text>
