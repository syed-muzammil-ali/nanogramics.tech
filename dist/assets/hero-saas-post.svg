<svg xmlns="http://www.w3.org/2000/svg" width="520" height="650" viewBox="0 0 520 650" role="img" aria-labelledby="title desc">
  <title id="title">SaaS platform graphic poster</title>
  <desc id="desc">Brand graphic for SaaS development with product interface cards and growth chart.</desc>
  <defs>
    <linearGradient id="g" x1="52" y1="20" x2="468" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#041126"/>
      <stop offset=".56" stop-color="#071a35"/>
      <stop offset="1" stop-color="#0bc4b7"/>
    </linearGradient>
    <linearGradient id="teal" x1="116" y1="184" x2="364" y2="456" gradientUnits="userSpaceOnUse">
